name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify deployment image builds
        run: docker build --build-arg SEALWORT_COMMIT_HASH="$GITHUB_SHA" --build-arg SEALWORT_REPOSITORY_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --file Dockerfile --tag sealwort-ci .
